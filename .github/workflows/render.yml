name: Render Brain Rot Video
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'The brain rot script'
        required: true
      headline:
        description: 'News headline'
        required: true
      story_name:
        description: 'The name of your timeline (e.g., news)'
        default: 'news'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install deps
        run: |
          npm install
          pip install edge-tts

      - name: 4. Prep folders and Generate JSON
        run: |
          # 1. Create the folder dynamically
          mkdir -p "public/content/${{ github.event.inputs.story_name }}"
          
          # 2. Create a basic timeline.json that Remotion expects
          # We use a 'cat' command to write the file
          cat <<EOF > "public/content/${{ github.event.inputs.story_name }}/timeline.json"
          {
            "storyName": "${{ github.event.inputs.story_name }}",
            "headline": "${{ github.event.inputs.headline }}",
            "script": "${{ github.event.inputs.script }}"
          }
          EOF

      - name: 5. Generate Audio
        run: |
          edge-tts --text "${{ github.event.inputs.script }}" \
          --write-media "public/content/${{ github.event.inputs.story_name }}/audio.mp3"

      - name: 6. Render Video
        run: >
          npx remotion render 
          ${{ github.event.inputs.story_name }} 
          public/video.mp4 
          --props="{\"headline\": \"${{ github.event.inputs.headline }}\"}"

      - name: 7. Telegram Upload
        run: |
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F "video=@public/video.mp4" \
          "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"
