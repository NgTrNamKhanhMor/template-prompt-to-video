jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install deps
        run: |
          npm install
          pip install edge-tts

      - name: 4. Create Directory
        run: mkdir -p "public/content/${{ github.event.inputs.story_name }}"

      - name: 5. Generate JSON
        run: |
          echo '{
            "storyName": "${{ github.event.inputs.story_name }}",
            "elements": [
              {
                "type": "text",
                "text": "${{ github.event.inputs.headline }}",
                "startMs": 0,
                "endMs": 5000
              }
            ]
          }' > "public/content/${{ github.event.inputs.story_name }}/timeline.json"

      - name: 6. Generate Audio
        run: edge-tts --text "${{ github.event.inputs.script }}" --write-media "public/content/${{ github.event.inputs.story_name }}/audio.mp3"

      - name: 7. Render Video
        run: npx remotion render "${{ github.event.inputs.story_name }}" public/video.mp4 --props="{\"headline\": \"${{ github.event.inputs.headline }}\"}"

      - name: 8. Telegram Upload
        run: curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -F "video=@public/video.mp4" "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"
