
name: Render Brain Rot Video
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'The brain rot script'
      headline:
        description: 'News headline'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install Dependencies
        run: npm i && pip install edge-tts
      
      - name: Generate Free Audio
        run: edge-tts --text "${{ github.event.inputs.script }}" --write-media public/audio.mp3
        
      - name: Render Video
        run: npx remotion render Main public/video.mp4 --props='{"headline": "${{ github.event.inputs.headline }}"}'
        
      - name: Upload to Telegram
        run: |
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -F "video=@public/video.mp4" \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo
