name: Render Brain Rot Video
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'The brain rot script'
        required: true
      headline:
        description: 'News headline'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install deps
        run: |
          npm install
          pip install edge-tts

      - name: 4. Prep folders
        run: mkdir -p public

      - name: 5. Generate Audio
        run: edge-tts --text "${{ github.event.inputs.script }}" --write-media public/audio.mp3

      - name: 6. Render Video
        # Check your Root.tsx: If ID is not "Main", change it here!
        run: npx remotion render Main public/video.mp4 --props='{"headline": "${{ github.event.inputs.headline }}"}'

      - name: 7. Telegram Upload
        run: |
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -F "video=@public/video.mp4" \
          "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"
